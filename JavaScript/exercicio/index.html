<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Desconto</title>

    <!-- Conexão com o arquivo JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Calculadora de Desconto</h1>

    <p>
        Informe o preço original do produto e a porcentagem de desconto
        para calcular o preço final.
    </p>

    <form id="formDesconto">

        <!-- Campo do preço original -->
        <label for="preco">
            Preço original do produto:
        </label>

        <input
            type="number"
            id="preco"
            name="preco"
            placeholder="Digite o preço"
            min="0"
            step="0.01"
        >

        <br><br>

        <!-- Campo da porcentagem de desconto -->
        <label for="desconto">
            Porcentagem de desconto:
        </label>

        <input
            type="number"
            id="desconto"
            name="desconto"
            placeholder="Digite o desconto (%)"
            min="0"
            max="100"
            step="0.01"
        >

        <br><br>

        <!-- Botão para calcular -->
        <button type="submit">
            Calcular desconto
        </button>

    </form>

</body>

</html>
