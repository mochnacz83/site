<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Template de página HTML">

    <title>Meu Site</title>

    <!-- Arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         CONTAINER PRINCIPAL
    ====================================================== -->

    <div class="container">

        <!-- =================================================
             CABEÇALHO
        ================================================== -->

        <header class="cabecalho">

            <div class="titulo-box">
                Cabeçalho
            </div>

        </header>


        <!-- =================================================
             MENU
        ================================================== -->

        <nav class="menu">

            <div class="titulo-box menu-box">
                Menu
            </div>

        </nav>


        <!-- =================================================
             ÁREA PRINCIPAL
        ================================================== -->

        <div class="area-principal">


            <!-- =============================================
                 COLUNA ESQUERDA
            ============================================== -->

            <aside class="coluna esquerda">

                <div class="titulo-box coluna-box">
                    Coluna<br>
                    Esquerda
                </div>

            </aside>


            <!-- =============================================
                 CONTEÚDO CENTRAL
            ============================================== -->

            <main class="conteudo">

                <div class="titulo-box conteudo-box">
                    Conteúdo
                </div>

            </main>


            <!-- =============================================
                 COLUNA DIREITA
            ============================================== -->

            <aside class="coluna direita">

                <div class="titulo-box coluna-box">
                    Coluna<br>
                    Direita
                </div>

            </aside>


        </div>


        <!-- =================================================
             RODAPÉ
        ================================================== -->

        <footer class="rodape">

            <div class="titulo-box rodape-box">
                Rodapé
            </div>

        </footer>

    </div>

</body>

</html>
